name: Build

on: push

permissions:
  write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 打包 .potext
        run: node build.js

      - name: 泄露检查（API Key / 隐私信息，含包内扫描）
        run: node scripts/check-secrets.js

      - name: 单元测试
        run: |
          node test/test.js
          node test/eval-smoke.mjs
          node test/migrate-sim.js

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin.com.neu.niutrans.potext
          path: '*.potext'
          if-no-files-found: error

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: '*.potext'
